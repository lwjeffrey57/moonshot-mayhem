<!doctype html><script src="/three.min.js"></script><script src="/fflate.min.js"></script><script src="/FBXLoader.js"></script>
<script>
const L=new THREE.FBXLoader();const load=u=>new Promise(r=>L.load(u,r));
(async()=>{const out={clips:{},info:{}};
 for(const n of ['idle','idle2','hit','strike','pitch']){const o=await load('/c_'+n+'.fbx');const c=o.animations.find(a=>a.duration>.5);
  c.tracks=c.tracks.filter(t=>/quaternion$/.test(t.name)||/Hips\.position$/.test(t.name));
  out.clips[n]={duration:+c.duration.toFixed(4),tracks:c.tracks.map(t=>({n:t.name.replace(/^mixamorig\d*/,''),t:Array.from(t.times).map(x=>+x.toFixed(4)),v:Array.from(t.values).map(x=>+x.toFixed(4))}))};
  const m=new THREE.AnimationMixer(o);m.clipAction(c).play();const B=k=>{let r;o.traverse(x=>{if(!r&&x.isBone&&/^mixamorig\d*/.test(x.name)&&x.name.replace(/^mixamorig\d*/,'')===k)r=x});return r};
  const v=new THREE.Vector3();const row=t=>{m.setTime(t);o.updateMatrixWorld(true);return ['Hips','LeftFoot','RightFoot','LeftHand','RightHand','Head'].map(k=>{B(k).getWorldPosition(v);return k+':'+v.toArray().map(x=>x.toFixed(0)).join(',')}).join(' ')};
  out.info[n]=[c.duration];for(let t=0;t<=c.duration;t+=(n=='strike'||n=='hit'?.1:.3))out.info[n].push(t.toFixed(1)+' '+row(Math.min(t,c.duration-.001)));}
 window.OUT=out;})();
</script>
